<div class="app-wrapper">
  @if (!isLoginRoute()) {
    <app-header />
  }

  <div class="contenido">
    @if (!isLoginRoute()) {
      <app-sidebar />
    }

    <div class="main-container">
      @if (!isLoginRoute()) {
        <app-breadcrumb />
      }
      <app-toast />
      <router-outlet />
    </div>
  </div>

  @if (!isLoginRoute()) {
    <app-footer />
  }

  <img class="sakura-watermark" [src]="theme.isOscuro()? 'assets/images/Logo-oscuro-MercadoCerezo.png': 'assets/images/Logo-MercadoCerezo.png'">
</div>
