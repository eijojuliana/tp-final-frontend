<div class="toast-container">
  @for (t of toast.toasts(); track t) {
    <div class="toast" [ngClass]="t.type">
      @if (t.type == 'success') { <img src="/assets/images/success-icon.png"> }
      @else { <img src="/assets/images/warning-icon-white.png"> }


      {{ t.message }}
    </div>
  }
</div>
