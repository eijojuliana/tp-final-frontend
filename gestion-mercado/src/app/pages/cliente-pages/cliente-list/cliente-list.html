<section class="list-container">
  <div class="botones">
    <button type="button" class="btn-agregar" routerLink="/menu/clientes/form">Agregar</button>

    <select (change)="atributo.set($any($event.target).value)">
      <option value="" disabled selected>Filtrar por...</option>
      <option value="personaId">ID</option>
      <option value="clienteId">ID Cliente</option>
      <option value="nombre">Nombre</option>
      <option value="apellido">Apellido</option>
      <option value="dni">DNI</option>
      <option value="fechaNacimiento">Fecha Nac.</option>
    </select>

    <select (change)="orden.set($any($event.target).value)">
      <option value="" disabled selected>Orden</option>
      <option value="asc">Ascendente</option>
      <option value="desc">Descendente</option>
    </select>

    <input type="text" placeholder="Buscar..." (input)="filtro.set($any($event.target).value)"/>
  </div>

  <div class="tabla-contenedor">
    <table class="tabla">
      <thead class="encabezado">
        <tr>
          <th>ID</th>
          <th>ID.CL</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Fecha Nac.</th>
          <th>DNI</th>
          <th class="celda-acciones">
            <div class="celda-acciones-div">
              Acciones
              <div class="acciones-botones">
                <a (click)="exportarExcel()">
                  <img class="historial-icon" src="/assets/images/excel-icon.png" alt="exportar excel" title="Exportar a Excel">
                </a>
                <a routerLink="/menu/historial/clientes">
                  <img class="historial-icon" src="/assets/images/historial-icon.png" alt="historial">
                </a>
              </div>
            </div>
          </th>
        </tr>
      </thead>

      <tbody class="tablaBody">
        @for (cliente of clientesFiltrados(); track cliente.clienteId){
          <tr>
            <td>{{ cliente.personaId }}</td>
            <td>{{ cliente.clienteId }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.apellido }}</td>
            <td>{{ cliente.fechaNacimiento }}</td>
            <td>{{ cliente.dni }}</td>
            <td class="acciones">
              <button class="btnEliminar" (click)="eliminarCliente(cliente.clienteId)">Eliminar</button>
              <button class="btnEditar" (click)="modificarCliente(cliente)">Editar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="7" class="sin-registros">
              No se encontraron registros
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
