<section class="list-container">
  <div class="botones">
    <input type="text" placeholder="Buscar..." (input)="filtro.set($any($event.target).value)" />

    <select (change)="atributo.set($any($event.target).value)">
      <option value="" disabled selected>Filtrar por...</option>
      <option value="personaId">ID Persona</option>
      <option value="duenioId">ID Dueño</option>
      <option value="nombre">Nombre</option>
      <option value="apellido">Apellido</option>
      <option value="dni">Dni</option>
      <option value="fechaNacimiento">Fecha Nac.</option>
      <option value="email">Email</option>
    </select>

    <select (change)="orden.set($any($event.target).value)">
      <option value="" disabled selected>Orden</option>
      <option value="asc">Ascendente</option>
      <option value="desc">Descendente</option>
    </select>

    <button type="button" class="btn-agregar" routerLink="/menu/duenios/form"> Agregar </button>
  </div>

  <div class="tabla-contenedor">
    <table class="tabla">
      <thead class="encabezado">
        <tr>
          <th> ID </th>
          <th> ID.Du </th>
          <th> Nombre </th>
          <th> Apellido </th>
          <th> Fecha Nac. </th>
          <th> DNI </th>
          <th> Email </th>
          <th class="celda-acciones">
            <div class="celda-acciones-div">
              Acciones
              <div class="acciones-botones">
                <a (click)="exportarExcel()">
                  <img class="historial-icon" src="/assets/images/excel-icon.png" alt="exportar excel" title="Exportar a Excel">
                </a>
                <a routerLink="/menu/historial/duenios">
                  <img class="historial-icon" src="/assets/images/historial-icon.png" alt="historial">
                </a>
              </div>
            </div>
          </th>
        </tr>
      </thead>

      <tbody class="tablaBody">
        @for (duenio of dueniosFiltrados(); track $index){
          <tr>
            <td>{{ duenio.personaId }}</td>
            <td>{{ duenio.duenioId }}</td>
            <td>{{ duenio.nombre }}</td>
            <td>{{ duenio.apellido }}</td>
            <td>{{ duenio.fechaNacimiento }}</td>
            <td>{{ duenio.dni }}</td>
            <td>{{ duenio.email }}</td>
            <td class="acciones">
              <button class="btnEliminar" (click)="eliminarDuenio(duenio.duenioId)"> Eliminar </button>
              <button class="btnEditar" (click)="modificarDuenio(duenio)"> Editar </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="8" class="sin-registros">
              No se encontraron registros
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
