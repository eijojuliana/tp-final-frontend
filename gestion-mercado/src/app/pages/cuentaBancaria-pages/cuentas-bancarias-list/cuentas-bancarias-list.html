<section class="list-container">
  <div class="botones">
    <button type="button" class="btn-agregar" routerLink="/menu/cuentas-bancarias/form"> Agregar </button>

    <select (change)="orden.set($any($event.target).value)">
      <option value="asc">Ascendente</option>
      <option value="desc">Descendente</option>
    </select>

    <select (change)="atributo.set($any($event.target).value)">
      <option value="cbu">CBU</option>
      <option value="saldo">Saldo</option>
    </select>

    <input type="text" placeholder="Buscar..." (input)="filtro.set($any($event.target).value)">
  </div>

  <div class="tabla-contenedor">
    <table class="tabla">
      <thead class="encabezado">
        <tr>
          <th>ID</th>
          <th>CBU</th>
          <th>Saldo</th>
          <th class="celda-acciones">
            <div class="celda-acciones-div">
              Acciones

              <div class="acciones-botones">
                <!-- Botón Excel -->
                <a (click)="exportarExcel()">
                  <img class="historial-icon" src="/assets/images/excel-icon.png" alt="exportar excel" title="Exportar a Excel">
                </a>

                <!-- Botón Historial -->
                <a routerLink="/menu/historial/cuentas-bancarias">
                  <img class="historial-icon" src="/assets/images/historial-icon.png" alt="historial">
                </a>
              </div>
            </div>
          </th>
        </tr>
      </thead>

      <tbody class="tablaBody">
        @for (c of cuentasFiltradas(); track $index) {
          <tr>
            <td>{{c.cuentaBancariaId}}</td>
            <td>{{c.cbu}}</td>
            <td>{{c.saldo}}</td>
            <td class="acciones">
              <button class="btnEliminar" (click)="deleteCuentaBancaria(c.cuentaBancariaId)">Eliminar</button>
              <button class="btnEditar" (click)="updateCuentaBancaria(c)">Editar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="sin-registros">
              No se encontraron registros
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
