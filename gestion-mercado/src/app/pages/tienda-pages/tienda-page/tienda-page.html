<main class="tienda-page-layout">
  <div class="central-container">
    <div class="card glass-card">
      <div class="header-section">
        <h1>Configuración de Tienda</h1>
        <p class="subtitle">Datos fiscales y operativos</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="saveTienda()">
        <div class="grid-form">
          <div class="campo">
            <label>Razón Social</label>
            <input type="text" formControlName="razonSocial" placeholder="Ej: Mercado del Cerezo S.A.">
          </div>
          <div class="campo">
            <label>Nombre de Fantasía</label>
            <input type="text" formControlName="nombreFantasia" placeholder="Ej: El Mercadito">
          </div>

          <div class="campo">
            <label>Ingresos Brutos</label>
            <input type="text" formControlName="ingresosBrutos" placeholder="Ej: 901-123456-7">
          </div>
          <div class="campo">
            <label>CUIT</label>
            <input type="number" formControlName="cuit" placeholder="Ej: 20123456789">
          </div>
          <div class="campo">
            <label>Punto de Venta</label>
            <input type="number" formControlName="puntoDeVenta" placeholder="Ej: 0001">
          </div>
          <div class="campo">
            <label>Fecha Inicio Actividades</label>
            <input type="date" formControlName="fechaInicioActividades">
          </div>

          <div class="campo">
            <label>DNI del Dueño</label>
            <input type="number" formControlName="duenioDni" placeholder="DNI del titular">
          </div>
          <div class="campo">
            <label>Condición IVA</label>
            <select formControlName="condicion">
              <option value="Monotributo" selected>Monotributo</option>
            </select>
          </div>

          <div class = "campo">
            <label> Url imagen de tu TIENDA: </label>
            <input type="url" formControlName="url">
            @if (form.get('url')?.invalid && form.get('url')?.touched) {
              <span class = "error">La url de la tienda debe ser válida.</span>
            }
          </div>

          @if (!isEditMode()) {
            <div class="campo">
              <label>Saldo de Caja</label>
              <input type="number" formControlName="caja" placeholder="Saldo inicial. Ej: 5000">
            </div>
          }
        </div>

        <details formGroupName="direccion" open>
          <summary>Dirección</summary>
          <div class="grid-form">
            <div class="campo">
              <label>Calle</label>
              <input type="text" formControlName="calle" placeholder="Ej: Av. Siempre Viva">
            </div>
            <div class="campo">
              <label>Altura</label>
              <input type="text" formControlName="altura" placeholder="Ej: 742">
            </div>
            <div class="campo">
              <label>Piso/Depto</label>
              <input type="text" formControlName="piso" placeholder="Ej: 2B">
            </div>
            <div class="campo">
              <label>Localidad</label>
              <input type="text" formControlName="localidad" placeholder="Ej: Springfield">
            </div>
            <div class="campo">
              <label>Código Postal</label>
              <input type="text" formControlName="codigopostal" placeholder="Ej: 7600">
            </div>
            <div class="campo : last-child">
              <label>Provincia</label>
              <input type="text" formControlName="provincia" placeholder="Ej: Buenos Aires">
            </div>
          </div>
          <div class="campo">
            <label>País</label>
            <input type="text" formControlName="pais" placeholder="Argentina">
          </div>
        </details>

        <div class="form-actions">
          <button (click)="saveTienda()" type="submit" class="btn-save" [disabled]="form.invalid">
            {{ isEditMode() ? 'Actualizar Datos' : 'Registrar Tienda' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</main>
