<section class="list-container">
  <div class="botones">
    <select (change)="atributo.set($any($event.target).value)">
      <option [ngValue]="null" disabled selected>Ordenar por</option>
      <option value="personaId">ID</option>
      <option value="nombre">Nombre</option>
      <option value="apellido">Apellido</option>
      <option value="fechaNacimiento">Fecha de Nacimiento</option>
      <option value="dni">DNI</option>
    </select>

    <select (change)="orden.set($any($event.target).value)">
      <option value="asc">Ascendente</option>
      <option value="desc">Descendente</option>
    </select>

    <input class="buscar-input" type="text" placeholder="Buscar..." (input)="filtro.set($any($event.target).value)" />
  </div>

  <div class="tabla-contenedor">
    <table class="tabla">
      <thead class="encabezado">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Fecha Nac.</th>
          <th>DNI</th>
          <th class="celda-acciones">Acciones</th>
          <th class="celda-boton">
            <a class="historial-link" routerLink="/menu/historial/personas">
              <img class="historial-icon" src="/assets/images/historial-icon.png" alt="historial">
            </a>
          </th>
        </tr>
      </thead>

      <tbody class="tablaBody">
        @for (persona of personasFiltradas(); track $index){
        <tr>
          <td>{{ persona.personaId }}</td>
          <td>{{ persona.nombre }}</td>
          <td>{{ persona.apellido }}</td>
          <td>{{ persona.fechaNacimiento }}</td>
          <td>{{ persona.dni }}</td>
          <td class="acciones">
            <button class="btnEliminar" (click)="deletePersona(persona.personaId)">Eliminar</button>
            <button class="btnEditar" (click)="updatePersona(persona)">Editar</button>
          </td>
        </tr>
        } @empty {
          <tr>
            <td class="sin-registros">
              No se encontraron registros
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
