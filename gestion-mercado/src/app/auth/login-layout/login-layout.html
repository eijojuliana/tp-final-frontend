<div class="login-page">
  <div class="login-card">

    <div class="login-izquierda">
      <div class="login-branding">
        <span class="material-icons brand-icon">store</span>
        <h1>Gestión de Mercado</h1>
        <p>Administrá tu negocio de forma sencilla</p>
      </div>
      <span class="badge">Iniciar Sesión</span>
    </div>

    <div class="login-derecha">

      <div class="login-content">

        <div class="icon">
          <span class="material-icons">person</span>
        </div>

        <h2>Login</h2>

        <form (ngSubmit)="login()">

          <div class="input-group">
            <label>Email<span class="obligatorio">*</span></label>
            <input
              type="text"
              name="username"
              placeholder="Email"
              [(ngModel)]="username"
              required
            >
          </div>

          <div class="input-group">
            <label>Contraseña<span class="obligatorio">*</span></label>
            <div class="password-input-wrapper">
              <input
                [type]="passwordVisible ? 'text' : 'password'"
                name="password"
                placeholder="Contraseña"
                [(ngModel)]="password"
                required
              >
              <button
                type="button"
                class="toggle-password"
                (click)="togglePasswordVisibility()"
              >
                <span class="material-icons">
                  {{ passwordVisible ? 'visibility_off' : 'visibility' }}
                </span>
              </button>
            </div>
            @if (errorMsg!='') {
              <p class="error">{{ errorMsg }}</p>
            }
          </div>

          <button type="submit" class="btn-login">Login</button>

        </form>

      </div>

    </div>

  </div>
</div>
